<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>JardinBot</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2e7d32"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fafafa;--card:#fff;--tx:#1b1f1c;--mu:#6b756e;--pr:#2e7d32;--pr2:#e4f3e1;--bd:#e3e8e2;--bar:#f1f8ee;--pill:#c9e9fb;--fab:#81d4fa;--fx:#0b2a3a;--gt:#d9fbc5;--gx:#3a9a00;--nt:#eee;--rd:#c62828;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--card:#19211b;--tx:#e8f0e6;--mu:#93a897;--pr:#6fcf74;--pr2:#223a26;--bd:#2a3a2d;--bar:#17221a;--pill:#1f4256;--gt:#1f3a14;--gx:#8be05a;--nt:#2a2f2b;--on:#0f1611;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101512;--card:#19211b;--tx:#e8f0e6;--mu:#93a897;--pr:#6fcf74;--pr2:#223a26;--bd:#2a3a2d;--bar:#17221a;--pill:#1f4256;--gt:#1f3a14;--gx:#8be05a;--nt:#2a2f2b;--on:#0f1611;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}.brand{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;letter-spacing:-.5px}.brand svg{color:var(--pr)}
.tabs{display:flex;align-items:center;border-bottom:1px solid var(--bd);padding:0 8px}.tabs button{flex:none;width:96px;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:14px 0;border-bottom:3px solid transparent}.tabs button.on{color:var(--pr);border-color:var(--pr)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.mc{flex:none;border:1.5px solid var(--bd);background:none;color:var(--tx);border-radius:999px;padding:9px 18px;font:inherit;font-size:16px}.mc.on{border-color:var(--pr);color:var(--pr);background:var(--pr2)}
main{padding:8px 14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:16px 18px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.big{font-size:24px;font-weight:800}.sub{color:var(--mu);font-size:13px}
.pill{display:flex;align-items:center;gap:8px;background:var(--pill);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;max-width:46%}.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;background:#8a97a0;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}.av.l{width:46px;height:46px;font-size:18px}
.tags{display:flex;gap:8px;margin-top:10px;align-items:center}.tag{border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--nt)}.tag.g{background:var(--gt);color:var(--gx)}
.chev{margin-left:auto;color:var(--mu)}
.sum{background:var(--pr2);border-radius:24px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}.sum div{text-align:center;flex:1}.sum b{display:block;font-size:20px;color:var(--pr)}.sum span{font-size:12px;color:var(--mu)}
.vr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd);font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:0;background:var(--fab);color:var(--fx);box-shadow:0 6px 16px #0004;display:grid;place-items:center;z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bar);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:13px}nav button i{padding:5px 22px;border-radius:999px;display:block;line-height:0}nav button.on{color:var(--tx);font-weight:700}nav button.on i{background:var(--pr2);color:var(--pr)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:var(--pill);border-radius:20px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;border:0;color:var(--tx);font:inherit;text-align:left}.tile b{font-size:26px}
.fcard{background:var(--pr2);border-radius:24px;padding:16px 18px;margin-bottom:12px}.fcard b{display:block;font-size:24px;font-weight:800}
.btn{border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;width:100%;margin-top:12px;background:var(--pr);color:var(--on)}.btn.g{background:var(--pr2);color:var(--pr)}.btn.r{background:none;color:var(--rd)}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:20}.sheet{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 8px;font-size:18px;display:flex;justify-content:space-between;align-items:center}.ib{border:0;background:none;color:var(--tx);padding:4px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}input,select,textarea{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:11px;font:inherit}
.tg{display:flex;flex-wrap:wrap;gap:6px}.tg button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 11px;font:inherit;font-size:13px}.tg button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.acts{display:flex;gap:8px;margin:6px 0}.acts a{flex:1;text-align:center;padding:9px;border-radius:12px;background:var(--pr2);color:var(--pr);text-decoration:none;font-weight:600;font-size:13px}
.empty{text-align:center;color:var(--mu);padding:34px 16px}.empty svg{color:var(--pr);opacity:.7}
.lr{display:flex;align-items:center;gap:14px;padding:10px 0}.nc{display:flex;align-items:center;gap:14px;padding:10px 0;border:0;background:none;color:var(--tx);font:inherit;width:100%;text-align:left}.nc .av{background:var(--fab);color:var(--fx)}
</style></head><body><div id="app"></div><div id="ov"></div>
<script>
const P={leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.800 10-10 10Z"/><path d="M2 21c0-3 1.900-5.400 5.100-6.500C9.500 13.700 12 13 14 12"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',chev:'<path d="m9 6 6 6-6 6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-6 8-6s8 2 8 6"/>',imp:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',tool:'<path d="M14.500 6a4 4 0 0 0 5 5L10 20.500a2.100 2.100 0 0 1-3-3L16.500 8"/>'};
const ic=(k,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;
const SV=[['🌿','Césped'],['✂️','Poda'],['💧','Riego'],['🌱','Fertilización'],['🐛','Plagas'],['🌸','Diseño'],['🧰','General']],FR=['Semanal','Quincenal','Mensual','Puntual'],MS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
let S={c:[],v:[]},T='v',SUB='',MODE='mes',Q='',X={},sel=[];
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let M=today().slice(0,7),D=today();
try{const r=JSON.parse(localStorage.getItem('jb')||'null');if(r&&r.c)S=r}catch(e){}
const save=()=>{try{localStorage.setItem('jb',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$U '+(+n||0).toLocaleString('es-UY',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>d.split('-').reverse().join('/'),cl=id=>S.c.find(c=>c.id==id),sv=n=>{const x=SV.find(s=>s[1]==n);return x?x[0]+' '+n:n};
const mlab=k=>MS[+k.slice(5)-1]+'/'+k.slice(2,4);
function mons(){const o=[],d=new Date();d.setDate(1);for(let i=0;i<12;i++){o.push(d.toISOString().slice(0,7));d.setMonth(d.getMonth()-1)}if(!o.includes(M))o.push(M);return o}
const chips=()=>`<div class="chips">${mons().map(k=>`<button class="mc ${k==M?'on':''}" onclick="M='${k}';draw()">${mlab(k)}</button>`).join('')}</div>`;
const vis=v=>v.done||v.date<=today(),inM=v=>v.date.slice(0,7)==M;
const nm=id=>{const c=cl(id);return c?c.name:'Cliente eliminado'};
const pillc=id=>`<div class="pill"><div class="av">${esc(nm(id)[0].toUpperCase())}</div><span>${esc(nm(id))}</span></div>`;
function vcard(v){return `<div class="card" onclick="edv('${v.id}')"><div class="row"><div class="big grow">${money(v.price)}</div>${pillc(v.cid)}</div><div class="sub" style="margin-top:16px">${fd(v.date)} · ${esc(sv(v.svc))}</div><div class="tags"><span class="tag ${v.done?'g':''}">${v.done?'REALIZADA':'AGENDADA'}</span><span class="tag ${v.paid?'g':''}">${v.paid?'PAGADA':'PENDIENTE'}</span><span class="chev">${ic('chev')}</span></div></div>`}
function home(){let h=`<div class="hd"><div class="brand">${ic('leaf',28)}JardinBot</div></div><div class="tabs"><button class="${MODE=='dia'?'on':''}" onclick="MODE='dia';draw()">DÍA</button><button class="${MODE=='mes'?'on':''}" onclick="MODE='mes';draw()">MES</button></div>`;
if(MODE=='dia'){const l=S.v.filter(v=>v.date==D);h+=`<main><input type="date" value="${D}" onchange="D=this.value||D;draw()" style="margin:6px 0 14px">${l.length?l.map(vcard).join(''):`<div class="empty">${ic('cal',48)}<p>No hay visitas este día.</p></div>`}</main>`;return h}
const l=S.v.filter(v=>inM(v)&&vis(v)),g={};l.forEach(v=>(g[v.cid]=g[v.cid]||[]).push(v));
const ids=Object.keys(g).sort((a,b)=>nm(a).localeCompare(nm(b))),tot=l.reduce((s,v)=>s+(+v.price||0),0);
h+=chips()+`<main><div class="sum"><div><b>${ids.length}</b><span>Clientes visitados</span></div><div><b>${l.length}</b><span>Visitas</span></div><div><b>${money(tot)}</b><span>Total del mes</span></div></div>`;
if(!ids.length)return h+`<div class="empty">${ic('leaf',48)}<p>No visitaste clientes en ${mlab(M)}.<br>Toca + para registrar una visita.</p></div></main>`;
return h+ids.map(id=>{const a=g[id].sort((x,y)=>x.date.localeCompare(y.date)),t=a.reduce((s,v)=>s+(+v.price||0),0),ok=a.every(v=>v.paid),o=X[id];
return `<div class="card"><div class="row" onclick="X['${id}']=!X['${id}'];draw()"><div class="av l">${esc(nm(id)[0].toUpperCase())}</div><div class="grow"><div style="font-weight:700">${esc(nm(id))}</div><div class="sub">${a.length} visita${a.length>1?'s':''} · ${a.map(v=>fd(v.date).slice(0,5)).join(', ')}</div></div><div style="text-align:right"><div style="font-weight:800">${money(t)}</div><span class="tag ${ok?'g':''}" style="font-size:11px;padding:2px 8px">${ok?'PAGADA':'PENDIENTE'}</span></div></div>${o?a.map(v=>`<div class="vr" onclick="edv('${v.id}')"><span>${fd(v.date)}</span><span class="grow sub">${esc(sv(v.svc))}</span><b>${money(v.price)}</b>${ic('chev',16)}</div>`).join(''):''}</div>`}).join('')+'</main>'}
function graf(){const l=S.v.filter(v=>inM(v)&&vis(v)),tot=l.reduce((s,v)=>s+(+v.price||0),0),cob=l.filter(v=>v.paid).reduce((s,v)=>s+(+v.price||0),0),by={};l.forEach(v=>by[v.cid]=(by[v.cid]||0)+(+v.price||0));
const top=Object.keys(by).sort((a,b)=>by[b]-by[a])[0],dim=new Date(+M.slice(0,4),+M.slice(5),0).getDate(),dv=Array(dim).fill(0);l.forEach(v=>dv[+v.date.slice(8)-1]+=(+v.price||0));const mx=Math.max(...dv,1);
const bars=dv.map((x,i)=>{const w=300/dim,hh=x/mx*110;return `<rect x="${(10+i*w+1).toFixed(1)}" y="${(120-hh).toFixed(1)}" width="${Math.max(w-2,2).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="var(--pr)"/>`}).join('');
return `<div class="hd"><div class="brand">${ic('leaf',28)}JardinBot</div></div>${chips()}<main><div class="fcard"><span class="sub">Facturación</span><b>${money(tot)}</b><div style="height:1px;background:var(--bd);margin:12px 0"></div><span class="sub">Cobrado</span><b>${money(cob)}</b></div><div class="g2"><div class="fcard"><span class="sub">Ticket promedio</span><b style="margin-top:18px;font-size:20px">${money(l.length?tot/l.length:0)}</b></div><div class="fcard"><span class="sub">Mayor cliente</span><b style="margin-top:18px;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${top?esc(nm(top)):'—'}</b></div></div><div class="card"><b>Facturación por día</b><svg viewBox="0 0 320 135" width="100%" style="margin-top:10px">${bars}<path d="M10 120h300" stroke="var(--bd)"/><text x="10" y="132" font-size="9" fill="var(--mu)">1</text><text x="310" y="132" font-size="9" fill="var(--mu)" text-anchor="end">${dim}</text></svg></div></main>`}
function opc(){return `<div class="hd"><div class="brand">${ic('leaf',28)}JardinBot</div></div><main><div class="row" style="margin-bottom:14px"><div class="av l" style="background:var(--pr)">${ic('leaf',24)}</div><div><b>Mi jardinería</b><div class="sub">Datos guardados en este dispositivo</div></div></div><b>Registros</b><div class="g2" style="margin-top:10px"><button class="tile" onclick="SUB='cl';draw()"><span class="row">${ic('user')}<b>${S.c.length}</b></span>Clientes</button><div class="tile"><span class="row">${ic('tool')}<b>${SV.length}</b></span>Servicios</div><div class="tile"><span class="row">${ic('cal')}<b>${S.v.length}</b></span>Visitas</div><button class="tile" onclick="imp()"><span class="row">${ic('imp')}</span>Importar contactos</button></div><b style="display:block;margin-top:18px">Copia de seguridad</b><div class="g2" style="margin-top:10px"><button class="tile" onclick="bkExp()"><span class="row">${ic('imp')}</span>Exportar copia</button><button class="tile" onclick="bkImp()"><span class="row">${ic('back')}</span>Restaurar copia</button></div><p class="sub">Guarda una copia de vez en cuando y envíala a tu correo o a Drive. Sirve para pasar tus datos a otro teléfono.</p></main>`}
function clist(){const q=Q.toLowerCase(),l=S.c.filter(c=>[c.name,c.addr,c.phone].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
return `<div class="hd" style="gap:12px;justify-content:flex-start"><button class="ib" onclick="SUB='';Q='';draw()">${ic('back',26)}</button><b style="font-size:20px">Clientes</b></div><main><input placeholder="Buscar cliente" value="${esc(Q)}" oninput="Q=this.value;cq()"><div id="cl"></div></main>`}
function cq(){const q=Q.toLowerCase(),l=S.c.filter(c=>[c.name,c.addr,c.phone].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
$('#cl').innerHTML=`<button class="nc" onclick="ed()"><div class="av l">${ic('plus',24)}</div>Nuevo Cliente</button>`+l.map(c=>`<button class="nc" onclick="ed('${c.id}')"><div class="av l" style="background:#8a97a0;color:#fff">${esc(c.name[0].toUpperCase())}</div><span class="grow">${esc(c.name)}</span><span class="chev">${ic('chev')}</span></button>`).join('')}
function draw(){const a=$('#app');a.innerHTML=(SUB=='cl'?clist():T=='v'?home():T=='g'?graf():opc())+(T=='o'&&SUB!='cl'?'':`<button class="fab" onclick="add()">${ic('plus',28)}</button>`)+`<nav>${[['v','cal','Visitas'],['g','chart','Gráficos'],['o','menu','Opciones']].map(x=>`<button class="${T==x[0]&&!SUB||(SUB&&x[0]=='o')?'on':''}" onclick="T='${x[0]}';SUB='';draw()"><i>${ic(x[1])}</i>${x[2]}</button>`).join('')}</nav>`;if(SUB=='cl')cq()}
function add(){SUB=='cl'?ed():edv()}
function sheet(t,b){$('#ov').innerHTML=`<div class="ov" onclick="if(event.target==this)cls()"><div class="sheet"><h2>${t}<button class="ib" onclick="cls()">${ic('x')}</button></h2>${b}</div></div>`}
function cls(){$('#ov').innerHTML=''}
function ed(id){const c=id?cl(id):{};sel=[...(c.svc||[])];const d=String(c.phone||'').replace(/\D/g,'');
sheet(id?'Editar cliente':'Nuevo cliente',`${id?`<div class="acts">${d?`<a href="tel:${d}">Llamar</a><a href="https://wa.me/${d}" target="_blank">WhatsApp</a>`:''}${c.addr?`<a href="https://maps.google.com/?q=${encodeURIComponent(c.addr)}" target="_blank">Mapa</a>`:''}</div>`:''}<label>Nombre</label><input id="n" value="${esc(c.name)}"><label>Teléfono</label><input id="p" type="tel" value="${esc(c.phone)}"><label>Correo</label><input id="e" type="email" value="${esc(c.email)}"><label>Dirección del jardín</label><input id="a" value="${esc(c.addr)}"><label>Servicios</label><div class="tg">${SV.map(s=>`<button class="${sel.includes(s[1])?'on':''}" onclick="ts(this,'${s[1]}')">${s[0]} ${s[1]}</button>`).join('')}</div><label>Frecuencia</label><select id="f">${FR.map(f=>`<option ${c.freq==f?'selected':''}>${f}</option>`).join('')}</select><label>Tarifa por visita</label><input id="pr" type="number" inputmode="decimal" value="${esc(c.price)}"><label>Notas</label><textarea id="o" rows="3">${esc(c.notes)}</textarea><button class="btn" onclick="sc('${id||''}')">Guardar</button>${id?`<button class="btn r" onclick="dc('${id}')">Eliminar cliente</button>`:''}`)}
function ts(b,s){const i=sel.indexOf(s);i<0?sel.push(s):sel.splice(i,1);b.classList.toggle('on')}
function sc(id){const o={name:$('#n').value.trim(),phone:$('#p').value.trim(),email:$('#e').value.trim(),addr:$('#a').value.trim(),svc:sel,freq:$('#f').value,price:$('#pr').value,notes:$('#o').value.trim()};if(!o.name)return;if(id)Object.assign(cl(id),o);else S.c.push({id:uid(),...o});save();cls();draw()}
function dc(id){S.c=S.c.filter(c=>c.id!=id);S.v=S.v.filter(v=>v.cid!=id);save();cls();draw()}
let fl={};
function edv(id){if(!S.c.length){sheet('Visita','<p>Primero agrega un cliente desde Opciones.</p>');return}
const v=id?S.v.find(x=>x.id==id):{date:MODE=='dia'?D:today(),svc:SV[0][1],done:true,paid:false};fl={done:!!v.done,paid:!!v.paid};
sheet(id?'Editar visita':'Nueva visita',`<label>Cliente</label><select id="vc" onchange="vp()">${S.c.map(c=>`<option value="${c.id}" ${v.cid==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>Fecha</label><input id="vd" type="date" value="${v.date}"><label>Servicio</label><select id="vs">${SV.map(s=>`<option value="${s[1]}" ${v.svc==s[1]?'selected':''}>${s[0]} ${s[1]}</option>`).join('')}</select><label>Precio</label><input id="vp" type="number" inputmode="decimal" value="${esc(v.price!=null?v.price:'')}"><div class="tg" style="margin-top:12px"><button class="${fl.done?'on':''}" onclick="fl.done=!fl.done;this.classList.toggle('on')">Realizada</button><button class="${fl.paid?'on':''}" onclick="fl.paid=!fl.paid;this.classList.toggle('on')">Pagada</button></div><button class="btn" onclick="sv2('${id||''}')">Guardar</button>${id?`<button class="btn r" onclick="dv('${id}')">Eliminar visita</button>`:''}`);if(!id)vp()}
function vp(){const c=cl($('#vc').value);if(c&&c.price)$('#vp').value=c.price}
function sv2(id){const o={cid:$('#vc').value,date:$('#vd').value,svc:$('#vs').value,price:$('#vp').value,done:fl.done,paid:fl.paid};if(!o.date)return;if(id)Object.assign(S.v.find(x=>x.id==id),o);else S.v.push({id:uid(),...o});M=o.date.slice(0,7);save();cls();draw()}
function dv(id){S.v=S.v.filter(v=>v.id!=id);save();cls();draw()}
function imp(){sheet('Importar contactos',`<p class="sub">Sube un archivo exportado (.vcf, .csv o .json) o pega su contenido.</p><input id="fi" type="file" accept=".vcf,.csv,.json,.txt,text/*" onchange="rf(this)"><label>O pega el contenido</label><textarea id="ta" rows="6"></textarea><button class="btn" onclick="go()">Importar</button><p id="rs" class="sub"></p>`)}
function rf(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#ta').value=r.result};r.readAsText(f)}
function csv(t){const r=[];let w=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','||c==';'){w.push(f);f=''}else if(c=='\n'){w.push(f);r.push(w);w=[];f=''}else if(c!='\r')f+=c}w.push(f);r.push(w);return r.filter(x=>x.some(y=>y.trim()))}
function nm2(o){const g=(...k)=>{for(const key in o){const kk=key.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(k.some(x=>kk.includes(x))&&String(o[key]||'').trim())return String(o[key]).trim()}return ''};return{name:(g('nombre','first name','name','contacto','cliente')+' '+g('apellido','last name')).trim(),phone:g('tel','phone','cel','movil','mobile'),email:g('mail','correo'),addr:g('direc','address','domicilio','street'),notes:g('nota','note','coment','obs')}}
function go(){const t=$('#ta').value.trim();let a=[];
try{if(/BEGIN:VCARD/i.test(t))a=t.split(/BEGIN:VCARD/i).slice(1).map(b=>{const f=k=>{const m=b.match(new RegExp('^'+k+'[^:\\n]*:(.*)$','im'));return m?m[1].replace(/\r/g,'').trim():''};return{name:f('FN'),phone:f('TEL'),email:f('EMAIL'),addr:f('ADR').split(';').filter(Boolean).join(' ').trim(),notes:f('NOTE')}});
else if(/^[\[{]/.test(t)){let j=JSON.parse(t);if(!Array.isArray(j))j=j.contacts||j.clientes||j.data||[j];a=j.map(nm2)}
else{const r=csv(t),h=r[0]||[];a=r.slice(1).map(x=>{const o={};h.forEach((k,i)=>o[k]=x[i]);return nm2(o)})}}catch(e){$('#rs').textContent='No pude leer ese formato.';return}
let n=0;a.filter(x=>x.name).forEach(x=>{const d=x.phone.replace(/\D/g,'');if(S.c.some(c=>(d&&String(c.phone).replace(/\D/g,'')==d)||c.name.toLowerCase()==x.name.toLowerCase()))return;S.c.push({id:uid(),svc:[],freq:'Mensual',price:'',...x});n++});
save();$('#rs').textContent=n?`Se importaron ${n} contactos.`:'No se encontraron contactos nuevos.';if(n)draw()}
function bkExp(){const b=new Blob([JSON.stringify({app:'jardinbot',fecha:today(),c:S.c,v:S.v})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jardinbot-copia-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}
function bkImp(){sheet('Restaurar copia',`<p class="sub">Elige el archivo jardinbot-copia-....json. Esto reemplaza los datos actuales de este teléfono.</p><input id="bkf" type="file" accept=".json,application/json,text/*"><button class="btn" onclick="bkGo()">Restaurar</button><p id="bkm" class="sub"></p>`)}
function bkGo(){const f=$('#bkf').files[0];if(!f){$('#bkm').textContent='Elige un archivo primero.';return}const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.c)||!Array.isArray(j.v))throw 0;S={c:j.c,v:j.v};save();cls();draw()}catch(e){$('#bkm').textContent='Ese archivo no es una copia válida de JardinBot.'}};r.readAsText(f)}
draw();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script></body></html>
